services:
  postgres:
    image: postgres:16-alpine
    container_name: agora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agora}
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - agora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora} -d ${POSTGRES_DB:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8090
      DATABASE_URL: postgres://${POSTGRES_USER:-agora}:${POSTGRES_PASSWORD:-agora}@postgres:5432/${POSTGRES_DB:-agora}?sslmode=disable
      UPLOAD_DIR: /app/data/uploads
      JWT_SECRET: ${JWT_SECRET:-agora-dev-secret-change-me-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      SEED: ${SEED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      TZ: America/Sao_Paulo
    ports:
      - "8090:8090"
    volumes:
      - agora-uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: agora-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  agora-pgdata:
  agora-uploads:
